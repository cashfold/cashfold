name: Feature request
description: Suggest an improvement or a new capability.
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Cashfold keeps data encrypted on your devices and treats the server as untrusted. A good request
        describes the problem; ideas that need the server to read your data cannot be accepted.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried, or considered instead?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Ledger (accounts, transactions, transfers)
        - Planning (budgets, schedules, goals)
        - Sharing and sync
        - Security and privacy
        - Desktop app
        - Relay server
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I would like to work on this myself.

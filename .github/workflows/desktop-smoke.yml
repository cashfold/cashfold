name: Desktop smoke

# Runs the packaged-app end-to-end tests on all three operating systems when something the desktop app is made from changes. Not a required
# check (a path-filtered required check would wait forever on pull requests that do not match); it is there to be looked at.

on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'apps/web/**'
      - 'packages/**'
      - '.github/workflows/desktop-*.yml'

permissions:
  contents: read

concurrency:
  group: desktop-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, test: 'pnpm --filter @cashfold/desktop test:packaged' }
          - { os: macos-latest, test: 'pnpm --filter @cashfold/desktop test:packaged' }
          - { os: ubuntu-latest, test: 'xvfb-run -a pnpm --filter @cashfold/desktop test:packaged' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Display for the tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - run: pnpm --filter @cashfold/web build
      - run: ${{ matrix.test }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: desktop-smoke-${{ matrix.os }}
          retention-days: 7
          path: apps/desktop/test-results

name: Benchmarks

# The performance budgets (SC-008: 50,000 transactions, SC-010: a 10,000-row list) on a slowed Chromium. They take half an hour or more, so
# they are not part of CI: run them from the Actions tab (Run workflow) when working on performance or before a release.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Benchmarks (50,000 transactions and the 10,000-row list)
        run: BENCH=1 pnpm exec playwright test -c e2e/playwright.config.ts e2e/bench --project=chromium

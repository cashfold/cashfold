name: Benchmarks

# The performance budgets (SC-008: 50,000 transactions, SC-010: a 10,000-row list) on a slowed Chromium. They take half an hour or more, so
# they are not part of CI: run them from the Actions tab (Run workflow) when working on performance or before a release.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Benchmarks (50,000 transactions and the 10,000-row list)
        run: BENCH=1 pnpm exec playwright test -c e2e/playwright.config.ts e2e/bench --project=chromium

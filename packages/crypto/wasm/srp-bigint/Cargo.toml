[package]
name = "cashfold-srp-bigint"
version = "0.1.0"
edition = "2021"
publish = false
description = "Constant-time modular exponentiation for the SRP-6a client (4096-bit group), over the audited crypto-bigint crate."
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
crypto-bigint = { version = "=0.7.5", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
